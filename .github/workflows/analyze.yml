name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      SERVERPOD_VERSION: '4.0.0-rc.2'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli $SERVERPOD_VERSION

      - name: Generate workspace source
        run: dart run melos run codegen --no-select

      - name: Analyze
        run: dart run melos run analyze

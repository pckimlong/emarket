name: emarket_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  path: ^1.9.1
  serverpod: 4.0.0-rc.2
  serverpod_auth_idp_server: 4.0.0-rc.2

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.0-rc.2
  test: ^1.25.5

serverpod:
  flutter_apps:
    Admin:
      path: ../../apps/admin
      displayName: "Admin app"
      auto_launch: false
      target: lib/main_dev.dart
    Customer:
      path: ../../apps/customer
      displayName: "Customer app"
      auto_launch: false
      target: lib/main.dart

  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\..\apps\customer
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\..\backend\emarket_server\web\app
      posix: |
        cd ../../apps/customer
        flutter build web --base-href /app/ --wasm --output ../../backend/emarket_server/web/app

services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: emarket
      POSTGRES_PASSWORD: "Pd0A-VcD3CwBoHuuSN_qoWw27G9-wzxW"
    volumes:
      - emarket_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "sddEKFnayeh0c1DBdASiANWGw1AgXo5p"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: emarket_test
      POSTGRES_PASSWORD: "4Fyv-qyoJln8zqln64odb93rcBO61w5W"
    volumes:
      - emarket_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "7-gS7Ef18ndSJ1NTP03lYtIZDDtx1zMO"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  emarket_data:
  emarket_test_data:
